name: nail-service-booking
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nsb-app
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      - VIRTUAL_HOST=booking.nailtech.loc
      - VIRTUAL_PORT=8000
    volumes:
      - ../:/var/www
    networks:
      - nsb-network
      - nginx-proxy

  queue-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nsb-app-queue-worker
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    depends_on:
      - app
    volumes:
      - ../:/var/www
    networks:
      - nsb-network
      - nginx-proxy

  mysql:
    image: mysql:latest
    container_name: nsb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - nsb-network

networks:
  nginx-proxy:
    external: true
  nsb-network:
    driver: bridge

volumes:
  mysql-data:
