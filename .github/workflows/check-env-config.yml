name: Check for .env or forbidden config files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for .env file
        run: |
          if [ -f ".env" ]; then
            echo "::warning file=.env,line=1,col=1::🚨 .env file found! This should not be committed."
          else
            echo "✅ .env file not found."
          fi

      - name: Check for forbidden files in config directory
        run: |
          FORBIDDEN_FILES=$(find config -type f \( -name "*.env" -o -name "*.secret" \) 2>/dev/null)
          if [ ! -z "$FORBIDDEN_FILES" ]; then
            echo "::warning::🚨 Forbidden config files found:"
            echo "$FORBIDDEN_FILES" | while read -r file; do
              echo "::warning file=$file,line=1,col=1::⚠️ $file should not be in the repo"
            done
          else
            echo "✅ No forbidden files found in config directory."
          fi
